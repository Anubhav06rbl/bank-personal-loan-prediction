[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-personal-loan-prediction"
version = "1.0.0"
description = "Production ML pipeline for predicting Bank Personal Loan acceptance using Random Forest, XGBoost, and CatBoost."
authors = [{ name = "ML Engineering Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "statsmodels>=0.14.0",
    "joblib>=1.3.0",
    "pydantic>=2.5.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
